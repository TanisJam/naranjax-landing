<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MandarinaX">
  <!-- The mark the header already draws: an orange tile with the X cut out of
       it in the page's own ground. Nothing else from the wordmark comes along —
       at 16 pixels "mandarina" is a smudge and the X is the only part of the
       name that survives, which is why the brand puts it there in the first
       place. The tile keeps the header's radius as a fraction of its side, so
       it is the same shape at every size a favicon is asked for. -->
  <rect width="64" height="64" rx="14" fill="#f37d06"/>
  <path d="M17.5 15h9.9l5.1 8.4L37.6 15h9.9L37.2 31.7 48 49h-9.9l-5.6-9L26.9 49H17l10.9-17.3z" fill="#220b0a"/>
</svg>
